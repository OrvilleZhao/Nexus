<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #0f0f0f; color: #e0e0e0; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #fff; }
    .version { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .status { background: #1a1a2e; border: 1px solid #333; border-radius: 8px;
              padding: 1rem; margin-bottom: 1rem; }
    .status h2 { font-size: 1rem; margin-bottom: 0.5rem; color: #4ecdc4; }
    .status p { font-size: 0.85rem; color: #aaa; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
           background: #4ecdc4; margin-right: 6px; }
    .dot.off { background: #ff6b6b; }
  </style>
</head>
<body>
  <h1>Nexus Desktop</h1>
  <p class="version">v0.1.0 — Nexus AI Agent OS</p>
  <div class="status">
    <h2><span class="dot"></span>System Status</h2>
    <p>Core: loaded | Bridge: active | Memory: ready</p>
  </div>
  <div class="status">
    <h2>Packages</h2>
    <p>core, bridge, memory, adapter-dsh, adapter-omnigent, sdk</p>
  </div>
</body>
</html>
