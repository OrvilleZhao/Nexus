name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build-dmg:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-13
            target: x86_64-apple-darwin
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Build Nexus packages
        run: pnpm build

      - name: Install desktop deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build frontend (TS → JS)
        working-directory: apps/desktop
        run: node build.mjs

      - name: Build Rust binary
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package DMG
        working-directory: apps/desktop
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          VERSION="${VERSION//\//-}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          BINARY_DIR="./src-tauri/target/${{ matrix.target }}/release" \
            bash ../../scripts/package-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Verify DMG
        run: |
          set -euo pipefail
          DMG=$(find apps/desktop/dist/macos -name '*.dmg' | head -1)
          echo "Found DMG: $DMG"
          test -f "$DMG"
          SIZE=$(stat -f%z "$DMG" 2>/dev/null || stat -c%s "$DMG")
          echo "DMG size: $SIZE bytes"
          test "$SIZE" -gt 1000000

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: nexus-desktop-${{ matrix.arch }}-dmg
          path: apps/desktop/dist/macos/*.dmg
          if-no-files-found: error

  release-dmg:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-dmg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nexus-desktop-*-dmg

      - name: Attach DMGs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.dmg
          append_body: true
          body: |
            ## Nexus Desktop

            macOS `.dmg` 安装包：
            - `nexus-desktop-arm64.dmg` — Apple Silicon (M1/M2/M3/M4)
            - `nexus-desktop-x64.dmg` — Intel Mac
        generate_release_notes: true
