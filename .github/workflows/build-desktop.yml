name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: mac-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            label: mac-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Build Nexus packages
        run: pnpm build

      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        working-directory: apps/desktop
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Collect DMGs
        run: |
          mkdir -p artifacts
          find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle \
            -name '*.dmg' -o -name '*.app.tar.gz' \
            | while read f; do cp "$f" artifacts/; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-desktop-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: warn

  release-dmg:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-dmg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nexus-desktop-*

      - name: Attach DMGs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.dmg
          append_body: true
          body: |
            ## Nexus Desktop

            macOS `.dmg` 安装包：
            - `nexus-desktop-mac-arm64.dmg` — Apple Silicon (M1/M2/M3/M4)
            - `nexus-desktop-mac-x64.dmg` — Intel Mac
        generate_release_notes: true
